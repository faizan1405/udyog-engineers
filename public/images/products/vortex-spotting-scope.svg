    <!-- Main Optical Barrel -->
    <path d="M165 73 L330 65 L330 155 L165 147 Z" fill="#28312E" stroke="#161A18" stroke-width="2"/>
    <!-- Sunshade Hood -->
    <rect x="330" y="60" width="45" height="100" rx="4" fill="#202724" stroke="#141816" stroke-width="2"/>
    <!-- Front Objective Lens Glare Ring -->
    <ellipse cx="375" cy="110" rx="10" ry="48" fill="#182E25" stroke="#3FA86B" stroke-width="1.5"/>
    <ellipse cx="375" cy="110" rx="6" ry="32" fill="none" stroke="#68C992" opacity="0.6"/>
    <!-- Tripod Mounting Foot -->
    <rect x="180" y="148" width="50" height="25" rx="3" fill="#1A201D" stroke="#121614"/>
    <polygon points="175,173 235,173 240,183 170,183" fill="#2E3734" stroke="#161A18"/>
