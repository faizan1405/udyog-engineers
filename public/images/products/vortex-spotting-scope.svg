    <path d="M40 70 L0 30 L25 5 L65 45 Z" fill="#202724" stroke="#141816" stroke-width="2"/>
    <ellipse cx="12" cy="18" rx="15" ry="8" fill="#141816" transform="rotate(-45 12 18)"/>
    <!-- Main Prism Prism Housing -->
    <path d="M45 50 L120 70 L120 150 L55 140 Z" fill="#28312E" stroke="#161A18" stroke-width="2"/>
    <!-- Dual Focus Ring Barrel -->
