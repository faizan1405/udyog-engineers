<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <rect width="800" height="600" fill="#F8F7F4"/>
  <rect x="24" y="24" width="752" height="552" rx="16" fill="#F1EFEA" stroke="#DDD9CE" stroke-width="1.5"/>
  
  <!-- Subtle coordinate grid -->
  <g opacity="0.25" stroke="#BFB9AA" stroke-width="1" stroke-dasharray="4 8">
    <line x1="24" y1="150" x2="776" y2="150"/>
    <line x1="24" y1="300" x2="776" y2="300"/>
    <line x1="24" y1="450" x2="776" y2="450"/>
    <line x1="200" y1="24" x2="200" y2="576"/>
    <line x1="400" y1="24" x2="400" y2="576"/>
    <line x1="600" y1="24" x2="600" y2="576"/>
  </g>

  <!-- Technical Header Badge -->
  <g transform="translate(48, 48)">
    <rect width="210" height="28" rx="14" fill="#E2DFD5" stroke="#CCC7BA"/>
    <circle cx="16" cy="14" r="5" fill="#1E6B3E"/>
    <text x="30" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#2C3531" letter-spacing="0.08em">GARMIN INSTINCT® 2X</text>
  </g>
  <text x="752" y="66" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#7E8580">MIL-STD-810 RUGGED SOLAR</text>

  <!-- Watch Schematic -->
  <g transform="translate(400, 260)">
    <!-- Heavy Duty Vented Polymer Straps -->
    <path d="M-45 -180 L-42 -82 L42 -82 L45 -180 Z" fill="#222825" stroke="#141816" stroke-width="2"/>
    <rect x="-18" y="-155" width="36" height="12" rx="2" fill="#141816"/>
    <rect x="-18" y="-130" width="36" height="12" rx="2" fill="#141816"/>
    <rect x="-18" y="-105" width="36" height="12" rx="2" fill="#141816"/>

    <path d="M-42 82 L-45 180 L45 180 L42 82 Z" fill="#222825" stroke="#141816" stroke-width="2"/>
    <rect x="-18" y="95" width="36" height="12" rx="2" fill="#141816"/>
    <rect x="-18" y="120" width="36" height="12" rx="2" fill="#141816"/>
    <rect x="-18" y="145" width="36" height="12" rx="2" fill="#141816"/>

    <!-- Rugged Angular 50mm Fiber-Reinforced Polymer Case -->
    <circle cx="0" cy="0" r="96" fill="#2B332F" stroke="#161B18" stroke-width="3"/>
    <!-- Outer Protective Bumpers -->
    <polygon points="-85,-50 -98,-30 -98,30 -85,50" fill="#202723"/>
    <polygon points="85,-50 98,-30 98,30 85,50" fill="#202723"/>

    <!-- Distinctive Instinct Inner Bezel -->
    <circle cx="0" cy="0" r="82" fill="#1E2421" stroke="#3A4640" stroke-width="2"/>
    
    <!-- Power Glass Solar Ring -->
    <circle cx="0" cy="0" r="74" fill="none" stroke="#B45309" stroke-width="4" opacity="0.8"/>

    <!-- Buttons -->
    <rect x="-106" y="-55" width="10" height="20" rx="3" fill="#3D4943" stroke="#141816"/>
    <rect x="-106" y="-10" width="10" height="20" rx="3" fill="#3D4943" stroke="#141816"/>
    <rect x="-106" y="35" width="10" height="20" rx="3" fill="#3D4943" stroke="#141816"/>
    <rect x="96" y="-45" width="10" height="22" rx="3" fill="#3D4943" stroke="#141816"/>
    <rect x="96" y="25" width="10" height="20" rx="3" fill="#3D4943" stroke="#141816"/>

    <!-- High-Contrast Monochrome Screen -->
    <circle cx="0" cy="0" r="69" fill="#111B15"/>

    <!-- Unique Dual-Window Circular Sub-Dial in Upper Right -->
    <circle cx="28" cy="-28" r="24" fill="#0C140F" stroke="#3F5547" stroke-width="2"/>
    <circle cx="28" cy="-28" r="4" fill="#4ADE80"/>
    <!-- Compass Pointer in Sub-Dial -->
    <polygon points="28,-46 25,-32 31,-32" fill="#4ADE80"/>
    <text x="28" y="-16" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#FFFFFF">N 012°</text>

    <!-- Main Digital Readout -->
    <text x="-18" y="-22" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#4ADE80">SOLAR ∞</text>
    <text x="-6" y="10" text-anchor="middle" font-family="ui-monospace, monospace" font-size="22" font-weight="800" fill="#F8FAFC">10:08</text>
    <text x="-6" y="26" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8">SEC 42</text>

    <!-- Trackback / Coordinate Line -->
    <text x="0" y="48" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#4ADE80">TRACBACK: 4.8 KM</text>
  </g>

  <!-- Technical Spec Footer Bar -->
  <g transform="translate(0, 475)">
    <text x="400" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#161A18">
      AUTHENTIC GARMIN INSTINCT® 2X SOLAR RUGGED SMARTWATCH
    </text>
    <text x="400" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6B726E">
      Unlimited Battery Life in Solar Mode · MIL-STD-810 Military Toughness · Multi-Band GNSS · Built-in LED Flashlight
    </text>
  </g>
</svg>
