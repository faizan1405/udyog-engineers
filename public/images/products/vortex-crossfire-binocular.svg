    <ellipse cx="65" cy="200" rx="22" ry="7" fill="none" stroke="#68C992" opacity="0.6"/>
    <ellipse cx="215" cy="200" rx="35" ry="12" fill="#182E25" stroke="#3FA86B" stroke-width="1.5"/>
    <ellipse cx="215" cy="200" rx="22" ry="7" fill="none" stroke="#68C992" opacity="0.6"/>
