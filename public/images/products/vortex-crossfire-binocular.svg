    <rect x="170" y="180" width="90" height="40" rx="8" fill="#202724" stroke="#161A18" stroke-width="2"/>
    <!-- Central Bridge & Hinge -->
    <rect x="100" y="70" width="80" height="90" rx="6" fill="#1A201D" stroke="#101412" stroke-width="1.5"/>
