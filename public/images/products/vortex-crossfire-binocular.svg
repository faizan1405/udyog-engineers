    <rect x="125" y="45" width="30" height="45" rx="4" fill="#3D4743" stroke="#161A18" stroke-width="1.5"/>
    <line x1="125" y1="55" x2="155" y2="55" stroke="#161A18"/>
    <line x1="125" y1="65" x2="155" y2="65" stroke="#161A18"/>
    <line x1="125" y1="75" x2="155" y2="75" stroke="#161A18"/>
    <!-- Objective Glass Glare Rings -->
