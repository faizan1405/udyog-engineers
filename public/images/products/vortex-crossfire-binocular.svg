  <text x="752" y="66" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#7E8580">CROSSFIRE HD · HD OPTICAL SYSTEM ROOF PRISM</text>

  <!-- Technical Schematic of Binocular -->
  <g transform="translate(260, 110)">
