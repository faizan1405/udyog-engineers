<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <rect width="800" height="600" fill="#F8F7F4"/>
  <rect x="24" y="24" width="752" height="552" rx="16" fill="#F1EFEA" stroke="#DDD9CE" stroke-width="1.5"/>
  
  <g opacity="0.25" stroke="#BFB9AA" stroke-width="1" stroke-dasharray="4 8">
    <line x1="24" y1="150" x2="776" y2="150"/>
    <line x1="24" y1="300" x2="776" y2="300"/>
    <line x1="24" y1="450" x2="776" y2="450"/>
    <line x1="200" y1="24" x2="200" y2="576"/>
    <line x1="400" y1="24" x2="400" y2="576"/>
    <line x1="600" y1="24" x2="600" y2="576"/>
  </g>

  <g transform="translate(48, 48)">
    <rect width="230" height="28" rx="14" fill="#E2DFD5" stroke="#CCC7BA"/>
    <circle cx="16" cy="14" r="5" fill="#059669"/>
    <text x="30" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#2C3531" letter-spacing="0.08em">VORTEX RANGEFINDER</text>
  </g>
  <text x="752" y="66" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#7E8580">HYPSOMETER · RANGE: HD OPTICAL SYSTEM</text>

  <!-- Technical Schematic of Laser Rangefinder -->
  <g transform="translate(290, 120)">
    <!-- Main Ergonomic Housing -->
    <path d="M0 40 Q40 10 110 10 L190 15 Q220 20 220 60 L220 160 Q210 190 180 190 L50 185 Q10 180 0 140 Z" fill="#28302D" stroke="#161A18" stroke-width="2.5"/>
    <!-- Top Measurement Buttons -->
    <rect x="75" y="4" width="35" height="8" rx="3" fill="#161A18"/>
    <rect x="125" y="8" width="30" height="7" rx="3" fill="#161A18"/>
    <!-- Eyepiece Diopter Ring (Back/Left) -->
    <rect x="-18" y="45" width="20" height="42" rx="4" fill="#1C221F" stroke="#101412" stroke-width="1.5"/>
    <ellipse cx="-18" cy="66" rx="5" ry="18" fill="#121614"/>
    <!-- Dual Front Lenses (Right) -->
    <rect x="218" y="35" width="12" height="45" rx="3" fill="#1A201D"/>
    <ellipse cx="230" cy="57" rx="4" ry="18" fill="#182E25" stroke="#3FA86B" stroke-width="1.5"/>
    <rect x="218" y="100" width="12" height="35" rx="3" fill="#1A201D"/>
    <ellipse cx="230" cy="117" rx="4" ry="14" fill="#3D1818" stroke="#D9383A" stroke-width="1.5"/>
    <!-- Grip Texture Patch -->
    <rect x="50" y="60" width="100" height="70" rx="8" fill="#1E2522" stroke="#333C38" stroke-dasharray="2 4"/>
    <!-- Laser Beam Graphic -->
    <line x1="235" y1="117" x2="275" y2="117" stroke="#D9383A" stroke-width="2" stroke-dasharray="6 3"/>
  </g>

  <g transform="translate(0, 420)">
    <text x="400" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#161A18">
      AUTHENTIC VORTEX LASER RANGEFINDER
    </text>
    <text x="400" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6B726E">
      Precision Distance &amp; Angle Measurement · Verified Manufacturer Calibration
    </text>
    <text x="400" y="80" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#8C938F">
      Authentic Product Photograph Subject to Official Distribution Clearance
    </text>
  </g>
</svg>