<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <rect width="800" height="600" fill="#F8F7F4"/>
  <rect x="24" y="24" width="752" height="552" rx="16" fill="#F1EFEA" stroke="#DDD9CE" stroke-width="1.5"/>
  
  <!-- Subtle coordinate grid -->
  <g opacity="0.25" stroke="#BFB9AA" stroke-width="1" stroke-dasharray="4 8">
    <line x1="24" y1="150" x2="776" y2="150"/>
    <line x1="24" y1="300" x2="776" y2="300"/>
    <line x1="24" y1="450" x2="776" y2="450"/>
    <line x1="200" y1="24" x2="200" y2="576"/>
    <line x1="400" y1="24" x2="400" y2="576"/>
    <line x1="600" y1="24" x2="600" y2="576"/>
  </g>

  <!-- Technical Header Badge -->
  <g transform="translate(48, 48)">
    <rect width="210" height="28" rx="14" fill="#E2DFD5" stroke="#CCC7BA"/>
    <circle cx="16" cy="14" r="5" fill="#1E6B3E"/>
    <text x="30" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#2C3531" letter-spacing="0.08em">GARMIN WEARABLE GPS</text>
  </g>
  <text x="752" y="66" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#7E8580">MULTISPORT FIELD ADVENTURE</text>

  <!-- Technical Schematic of Garmin GPS Smartwatch -->
  <g transform="translate(400, 260)">
    <!-- Top Strap -->
    <path d="M-45 -180 L-40 -80 L40 -80 L45 -180 Z" fill="#2A322F" stroke="#1B221F" stroke-width="2"/>
    <line x1="-35" y1="-150" x2="35" y2="-150" stroke="#3A4440" stroke-width="2"/>
    <line x1="-35" y1="-120" x2="35" y2="-120" stroke="#3A4440" stroke-width="2"/>
    <line x1="-35" y1="-90" x2="35" y2="-90" stroke="#3A4440" stroke-width="2"/>

    <!-- Bottom Strap -->
    <path d="M-40 80 L-45 180 L45 180 L40 80 Z" fill="#2A322F" stroke="#1B221F" stroke-width="2"/>
    <line x1="-35" y1="100" x2="35" y2="100" stroke="#3A4440" stroke-width="2"/>
    <line x1="-35" y1="130" x2="35" y2="130" stroke="#3A4440" stroke-width="2"/>
    <line x1="-35" y1="160" x2="35" y2="160" stroke="#3A4440" stroke-width="2"/>

    <!-- Watch Outer Case -->
    <circle cx="0" cy="0" r="95" fill="#202724" stroke="#161A18" stroke-width="3"/>

    <!-- Titanium Bezel Ring -->
    <circle cx="0" cy="0" r="88" fill="#2C3632" stroke="#43504A" stroke-width="2"/>
    <!-- Bezel Screws -->
    <circle cx="0" cy="-80" r="3" fill="#6A7B74"/>
    <circle cx="76" cy="-25" r="3" fill="#6A7B74"/>
    <circle cx="47" cy="65" r="3" fill="#6A7B74"/>
    <circle cx="-47" cy="65" r="3" fill="#6A7B74"/>
    <circle cx="-76" cy="-25" r="3" fill="#6A7B74"/>

    <!-- Push Buttons / Sensor Guard -->
    <rect x="-104" y="-55" width="10" height="22" rx="3" fill="#3D4944" stroke="#161A18"/>
    <rect x="-104" y="-10" width="10" height="22" rx="3" fill="#3D4944" stroke="#161A18"/>
    <rect x="-104" y="35" width="10" height="22" rx="3" fill="#3D4944" stroke="#161A18"/>
    <rect x="94" y="-45" width="10" height="26" rx="4" fill="#C84B31" stroke="#161A18"/>
    <rect x="94" y="25" width="10" height="22" rx="3" fill="#3D4944" stroke="#161A18"/>

    <!-- Inner Display Screen Canvas -->
    <circle cx="0" cy="0" r="74" fill="#101814"/>

    <!-- Topoactive Map Contour Lines -->
    <path d="M-55 10 Q-30 -25 0 -15 T55 -30" stroke="#2563EB" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M-50 30 Q-20 5 15 20 T60 0" stroke="#1E6B3E" stroke-width="2" fill="none" opacity="0.9"/>
    <path d="M-40 50 Q0 30 30 45 T55 35" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

    <!-- GPS Coordinate & Elevation Dial -->
    <circle cx="0" cy="0" r="64" stroke="#3A4D43" stroke-width="1" stroke-dasharray="2 4" fill="none"/>
    <polygon points="0,-68 -5,-58 5,-58" fill="#1E6B3E"/>
    <circle cx="0" cy="0" r="4" fill="#5CE596"/>
    <circle cx="0" cy="0" r="10" stroke="#5CE596" stroke-width="1" stroke-dasharray="2 2" fill="none"/>

    <!-- Digital Dial Telemetry -->
    <text x="0" y="-32" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#5CE596">GNSS LOCK</text>
    <text x="0" y="-15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">10:08</text>
    <text x="0" y="55" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8">ALT 2,840m</text>
  </g>

  <!-- Technical Spec Footer Bar -->
  <g transform="translate(0, 475)">
    <text x="400" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#161A18">
      AUTHENTIC GARMIN GPS SMARTWATCH &amp; WEARABLE HARDWARE
    </text>
    <text x="400" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6B726E">
      Multi-Band GNSS · TopoActive Continental Mapping · MIL-STD-810 / 10 ATM Rugged Chassis
    </text>
  </g>
</svg>
